<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Lumière Capsules</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>try{var l=localStorage.getItem('lumiere_logo_cache');if(l){var s=document.createElement('style');s.id='lumiere-logo-styles';s.textContent='a.logo[data-slot="site-logo"]{font-size:0!important;letter-spacing:0!important;background:url("'+l+'") no-repeat left center / contain;display:block;width:200px;height:78px;flex-shrink:0}a.logo[data-slot="site-logo"]>*{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important}nav{padding-top:0.4rem!important;padding-bottom:0.4rem!important}.nav-inner{align-items:center!important;gap:1rem}@media(max-width:1280px){a.logo[data-slot="site-logo"]{width:180px;height:70px}.nav-links{gap:1.5rem!important}}@media(max-width:1100px){a.logo[data-slot="site-logo"]{width:162px;height:63px}.nav-links{gap:1.1rem!important}.nav-links a{font-size:0.72rem!important;letter-spacing:0.1em!important}}@media(max-width:960px){.nav-links{display:none!important}}@media(max-width:900px){a.logo[data-slot="site-logo"]{width:155px;height:60px}}@media(max-width:600px){a.logo[data-slot="site-logo"]{width:145px;height:56px}}';document.head.appendChild(s);}}catch(e){}</script>
<style>
  :root{--ink:#1a1a1a;--ink-soft:#3a3a38;--paper:#faf7f2;--cream:#f3ede2;--champagne:#d4b896;--gold:#b8935a;--gold-deep:#8b6f3f;--line:rgba(26,26,26,0.08);--green:#5d8a4a;--red:#b94e3e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--cream);line-height:1.5;font-weight:300;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400;letter-spacing:-0.01em}
  h1{font-size:clamp(2rem,4vw,3rem);font-weight:300}
  h2{font-size:1.6rem}
  a{color:inherit;text-decoration:none}
  .container{max-width:1240px;margin:0 auto;padding:0 2rem}
  .eyebrow{text-transform:uppercase;letter-spacing:0.3em;font-size:0.7rem;font-weight:500;color:var(--gold-deep);margin-bottom:0.8rem;display:inline-block}

  nav{background:rgba(250,247,242,0.9);backdrop-filter:blur(18px);padding:1rem 0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .nav-inner{display:flex;justify-content:space-between;align-items:center;max-width:1240px;margin:0 auto;padding:0 2rem}
  .logo{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:500;letter-spacing:0.05em}
  .logo span{color:var(--gold-deep)}
  .secure{font-size:0.78rem;color:var(--ink-soft);display:flex;align-items:center;gap:0.5rem}
  .secure svg{width:16px;height:16px;color:var(--green)}

  header.page-head{padding:3rem 0 2rem;background:var(--paper);border-bottom:1px solid var(--line)}
  .back-link{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);margin-bottom:2.4rem;transition:color .3s,transform .3s}
  .back-link:hover{color:var(--gold-deep);transform:translateX(-3px)}
  .back-link svg{width:15px;height:15px}
  header.page-head h1 em{font-style:italic;color:var(--gold-deep)}

  main{padding:3rem 0 5rem}
  .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:3rem;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}

  .step-card{background:var(--paper);border-radius:14px;padding:2rem;border:1px solid var(--line);margin-bottom:1.5rem}
  .step-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
  .step-head h2{font-size:1.5rem}
  .step-num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:'Cormorant Garamond',serif;font-weight:500;display:inline-flex;align-items:center;justify-content:center;margin-right:0.7rem}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
  @media(max-width:600px){.form-row{grid-template-columns:1fr}}
  .form-field{margin-bottom:1rem}
  .form-field.full{grid-column:1/-1}
  .form-field label{display:block;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.18em;color:var(--ink-soft);font-weight:600;margin-bottom:0.4rem}
  .form-field input, .form-field select{width:100%;padding:0.85rem 1rem;border-radius:8px;border:1px solid var(--line);background:var(--cream);font-family:'Inter',sans-serif;font-size:0.95rem;color:var(--ink);font-weight:300}
  .form-field input:focus, .form-field select:focus{outline:none;border-color:var(--gold);background:var(--paper);box-shadow:0 0 0 3px rgba(212,184,150,0.15)}

  .summary{position:sticky;top:6rem}
  .line-items{margin-bottom:1.5rem}
  .line{display:grid;grid-template-columns:48px 1fr auto;gap:1rem;padding:0.9rem 0;border-bottom:1px solid var(--line);align-items:center}
  .line:last-child{border-bottom:none}
  .line-thumb{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#f5ede0,#d4b896);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;color:var(--gold-deep);font-style:italic;font-weight:500;overflow:hidden;flex-shrink:0}
  .line-thumb.has-image{background:#fff;font-size:0}
  .line-thumb.has-image img{width:100%!important;height:100%!important;object-fit:cover!important;display:block}
  .line-name{font-weight:500;font-size:0.9rem}
  .line-meta{font-size:0.75rem;color:var(--ink-soft);margin-top:0.15rem}
  .line-price{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:500}

  .totals{padding-top:1.5rem;border-top:1px solid var(--line)}
  .total-row{display:flex;justify-content:space-between;padding:0.5rem 0;font-size:0.92rem;color:var(--ink-soft)}
  .total-row.grand{padding-top:0.8rem;margin-top:0.5rem;border-top:2px solid var(--ink);font-size:1.1rem;color:var(--ink);font-weight:500}
  .total-row.grand .v{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--gold-deep)}

  .promo{display:flex;gap:0.6rem;margin:1rem 0}
  .promo input{flex:1;padding:0.7rem 1rem;border-radius:50px;border:1px solid var(--line);background:var(--cream);font-size:0.85rem}

  .btn{padding:1.1rem 1.5rem;border-radius:50px;border:none;cursor:pointer;background:var(--ink);color:var(--paper);font-size:0.78rem;letter-spacing:0.15em;text-transform:uppercase;font-weight:600;transition:all .3s;font-family:'Inter',sans-serif;width:100%}
  .btn:hover{background:var(--gold-deep);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .btn-ghost:hover{background:var(--ink);color:var(--paper)}

  .empty-cart{background:var(--paper);padding:5rem 2rem;border-radius:14px;text-align:center;border:1px solid var(--line)}
  .empty-cart h2{margin-bottom:0.7rem}
  .empty-cart .btn{display:inline-block;width:auto;margin-top:1.5rem;padding:0.85rem 1.8rem}

  .pay-providers{display:flex;gap:0.8rem;margin-top:0.8rem;align-items:center;flex-wrap:wrap}
  .pay-pill{padding:0.4rem 0.9rem;border-radius:6px;background:var(--cream);font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);border:1px solid var(--line)}

  .trust-row{display:flex;justify-content:space-around;padding:1.5rem;background:var(--paper);border-radius:14px;border:1px solid var(--line);margin-top:1.5rem;flex-wrap:wrap;gap:1rem}
  .trust-item{font-size:0.78rem;display:flex;align-items:center;gap:0.5rem;color:var(--ink-soft)}
  .trust-item svg{width:18px;height:18px;color:var(--gold-deep)}

  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--paper);padding:0.9rem 1.8rem;border-radius:50px;font-size:0.85rem;box-shadow:0 12px 30px rgba(0,0,0,0.2);transition:transform .4s cubic-bezier(.2,.9,.3,1.1);z-index:400}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .demo-banner{background:#fef3c7;border:1px solid #f59e0b;color:#92400e;padding:0.7rem 1rem;border-radius:8px;font-size:0.82rem;margin-bottom:2rem}
  .demo-banner strong{color:#78350f}
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="img/lumiere-skincare-icon.png">
<link rel="apple-touch-icon" href="img/lumiere-skincare-icon.png">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo" data-slot="site-logo" data-slot-alt="Lumière">Lumière<span>.</span></a>
    <div class="secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L4 7v6c0 5 4 9 8 9s8-4 8-9V7l-8-5z"/><path d="M9 12l2 2 4-4"/></svg>
      Secure Checkout
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="container">
    <a href="shop.html" class="back-link" id="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span id="back-label">Back to Shop</span>
    </a>
    <br>
    <span class="eyebrow">Almost there</span>
    <h1>Checkout · <em>your ritual awaits.</em></h1>
  </div>
</header>

<main>
  <div class="container">
    <div id="checkout-app"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="analytics.js"></script>
<script src="api.js"></script>
<script src="images.js"></script>
<script src="autofill.js"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = n => '$' + n.toFixed(2);

/* Demo notices are owner-only — customers never see them */
const ADMIN_EMAILS = ['seoprrocket@gmail.com'];
function isOwnerViewer(){
  try {
    if(new URLSearchParams(location.search).get('demo') === '1') return true;
    const raw = sessionStorage.getItem('lumiere_session') || localStorage.getItem('lumiere_session');
    if(raw){ const s = JSON.parse(raw); if(s && ADMIN_EMAILS.includes(s.email)) return true; }
  } catch(e){}
  return false;
}
const showDemoNotice = () => Lumiere.isDemo() && isOwnerViewer();

/* Back link points to the page the shopper actually came from */
(function(){
  const PAGE_NAMES = {
    'shop.html':'Shop', 'index.html':'Home', '':'Home',
    'travel-hacks.html':'Travel Hacks', 'travel-gallery.html':'Packing',
    'before-after.html':'Before & After', 'instructions.html':'How to Use',
    'about.html':'About', 'contact.html':'Contact', 'portal.html':'Portal',
    'returns.html':'Returns', 'shipping.html':'Shipping'
  };
  const link = document.getElementById('back-link');
  const label = document.getElementById('back-label');
  if(!link || !label) return;
  try {
    const ref = document.referrer;
    if(ref){
      const u = new URL(ref);
      if(u.origin === location.origin){
        const file = u.pathname.split('/').pop();
        if(file !== 'checkout.html'){
          const name = PAGE_NAMES[file];
          if(name){
            link.href = u.pathname + u.search + u.hash;
            label.textContent = 'Back to ' + name;
            return;
          }
        }
      }
    }
  } catch(e){}
  // Fallback: continue shopping
  link.href = 'shop.html';
  label.textContent = 'Back to Shop';
})();

// Map cart product names to their shop image slots (shown as thumbnails in the summary)
const THUMB_SLOTS = {
  '3-Day Trial Pack': 'pack-3day',
  '7-Day Pack': 'pack-7day',
  'Deluxe Set': 'pack-deluxe',
  'Hydrating Hydrogel Mask': 'pack-mask'
};
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2400); };

function render(){
  const cart = Lumiere.Cart.get();
  const app = $('#checkout-app');

  if(!cart.length){
    app.innerHTML = `
      <div class="empty-cart">
        <h2>Your bag is empty.</h2>
        <p>Add a pack to get started.</p>
        <a href="shop.html" class="btn">Shop the Capsules</a>
      </div>`;
    return;
  }

  const subtotal = Lumiere.Cart.subtotal();
  const shipping = subtotal >= 75 ? 0 : 8;
  const tax = +(subtotal * 0.08).toFixed(2);
  const total = subtotal + shipping + tax;

  app.innerHTML = `
    ${showDemoNotice() ? '<div class="demo-banner"><strong>Demo mode.</strong> Real checkout will use Stripe — see DEPLOYMENT.md to wire it up. For now, completing checkout creates a local order in your portal.</div>' : ''}

    <div class="grid">
      <div>
        <div class="step-card">
          <div class="step-head">
            <h2><span class="step-num">1</span>Contact</h2>
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-field">
            <label style="display:flex;align-items:center;gap:0.5rem;text-transform:none;letter-spacing:0;font-size:0.85rem;color:var(--ink-soft);font-weight:300">
              <input type="checkbox" id="newsletter" checked> Email me about new launches &amp; The Letter (monthly).
            </label>
          </div>
        </div>

        <div class="step-card">
          <div class="step-head"><h2><span class="step-num">2</span>Shipping Address</h2></div>
          <div class="form-row">
            <div class="form-field"><label>First Name</label><input type="text" id="firstName" required></div>
            <div class="form-field"><label>Last Name</label><input type="text" id="lastName" required></div>
          </div>
          <div class="form-field"><label>Street Address</label><input type="text" id="street" required></div>
          <div class="form-row">
            <div class="form-field"><label>City</label><input type="text" id="city" required></div>
            <div class="form-field"><label>State / Region</label><input type="text" id="state" required></div>
          </div>
          <div class="form-row">
            <div class="form-field"><label>Postal Code</label><input type="text" id="zip" required></div>
            <div class="form-field">
              <label>Country</label>
              <select id="country">
                <option value="US" selected>United States</option>
                <option value="CA">Canada</option>
                <option value="GB">United Kingdom</option>
                <option value="FR">France</option>
                <option value="DE">Germany</option>
                <option value="AU">Australia</option>
                <option value="JP">Japan</option>
              </select>
            </div>
          </div>
        </div>

        <div class="step-card">
          <div class="step-head">
            <h2><span class="step-num">3</span>Payment</h2>
            <div class="pay-providers">
              <span class="pay-pill">Stripe</span>
              <span class="pay-pill">Apple Pay</span>
              <span class="pay-pill">Google Pay</span>
              <span class="pay-pill">Klarna</span>
            </div>
          </div>
          <p style="font-size:0.88rem;line-height:1.7;color:var(--ink-soft);margin-bottom:0.8rem">Payment is processed securely by Stripe. Your card details never touch our servers.</p>
          ${showDemoNotice() ? '<p style="font-size:0.8rem;color:var(--gold-deep);font-style:italic">Demo mode: clicking "Place Order" below skips Stripe and creates a local test order.</p>' : '<div id="stripe-card-element"><!-- Stripe Elements mounts here --></div>'}
        </div>

        <button class="btn" id="place-order">Place Order · ${fmt(total)}</button>
        <p style="font-size:0.78rem;color:var(--ink-soft);margin-top:1rem;text-align:center">By placing your order, you agree to our <a href="returns.html" style="color:var(--gold-deep);text-decoration:underline">Return Policy</a>, <a href="terms.html" style="color:var(--gold-deep);text-decoration:underline">Terms of Service</a> and <a href="privacy.html" style="color:var(--gold-deep);text-decoration:underline">Privacy Policy</a>.</p>
      </div>

      <aside class="summary">
        <div class="step-card">
          <h2 style="margin-bottom:1.2rem">Order Summary</h2>
          <div class="line-items">
            ${cart.map(item => `
              <div class="line">
                <div class="line-thumb"${THUMB_SLOTS[item.name] ? ` data-slot="${THUMB_SLOTS[item.name]}" data-slot-alt="${item.name}" data-slot-fit="cover"` : ''}>L</div>
                <div>
                  <div class="line-name">${item.name}</div>
                  <div class="line-meta">${item.meta || ''} · Qty ${item.qty}</div>
                </div>
                <div class="line-price">${fmt(item.price * item.qty)}</div>
              </div>
            `).join('')}
          </div>
          <div class="promo">
            <input type="text" placeholder="Promo / ambassador code" id="promo">
            <button class="btn-ghost btn" style="width:auto;padding:0.7rem 1.2rem;font-size:0.7rem" id="apply-promo">Apply</button>
          </div>
          <div id="promo-applied" style="display:none;font-size:0.8rem;color:var(--green);padding:0.4rem 0"></div>
          <div class="totals">
            <div class="total-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
            <div class="total-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : fmt(shipping)}</span></div>
            <div class="total-row"><span>Tax (est.)</span><span>${fmt(tax)}</span></div>
            <div class="total-row grand"><span>Total</span><span class="v">${fmt(total)}</span></div>
          </div>
        </div>

        <div class="trust-row">
          <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L4 7v6c0 5 4 9 8 9s8-4 8-9V7l-8-5z"/><path d="M9 12l2 2 4-4"/></svg> 30-Day Guarantee</div>
          <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-7"/></svg> Free Returns</div>
        </div>
      </aside>
    </div>
  `;

  $('#place-order').addEventListener('click', placeOrder);

  // Fill line-item thumbnails with the real product images (uploaded via Admin → Images)
  window.Lumiere?.Images?.applyToPage?.();

  // Ambassador / promo code apply
  $('#apply-promo')?.addEventListener('click', async () => {
    const code = $('#promo').value.trim();
    if(!code) return;
    const found = await Lumiere.Ambassadors.lookupCode(code);
    if(found && found.status === 'active'){
      window._ambCode = code;
      const el = $('#promo-applied');
      el.style.display = 'block';
      el.textContent = `✓ Code ${code.toUpperCase()} applied — 10% off · supporting ${found.ambassador} (${found.channel})`;
      toast('Ambassador code applied — 10% off!');
    } else if(found){
      toast('This code is not currently active.');
    } else {
      toast('Code not recognized.');
    }
  });
  // Auto-apply from ?code= URL param (ambassador share links)
  const urlCode = new URLSearchParams(location.search).get('code');
  if(urlCode && !window._ambCodeChecked){
    window._ambCodeChecked = true;
    $('#promo').value = urlCode;
    $('#apply-promo')?.click();
  }
}

async function placeOrder(){
  const required = ['email','firstName','lastName','street','city','state','zip'];
  const data = {};
  let valid = true;
  required.forEach(f => {
    const el = $('#' + f);
    if(!el.value.trim()){ el.style.borderColor = '#c44'; valid = false; }
    else { el.style.borderColor=''; data[f] = el.value.trim(); }
  });
  if(!valid){ toast('Please fill in required fields.'); return; }

  data.country = $('#country').value;
  const customer = {
    name: data.firstName + ' ' + data.lastName,
    email: data.email,
    address: `${data.street}, ${data.city}, ${data.state} ${data.zip}, ${data.country}`
  };

  if($('#newsletter').checked){ Lumiere.Newsletter.subscribe(data.email, 'checkout'); }

  $('#place-order').disabled = true;
  $('#place-order').textContent = 'Processing…';

  try {
    // Attribute the order to the ambassador if a code was applied
    if(window._ambCode){
      const cartTotal = Lumiere.Cart.subtotal() * 0.9; // after 10% discount
      await Lumiere.Ambassadors.attributeOrder(window._ambCode, cartTotal);
    }
    const result = await Lumiere.startCheckout(Lumiere.Cart.get(), customer);
    if(result.url) window.location.href = result.url;
  } catch(e){
    toast('Checkout failed: ' + e.message);
    $('#place-order').disabled = false;
    render();
  }
}

render();
window.addEventListener('cart:change', render);
</script>

</body>
</html>
