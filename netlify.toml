[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install --omit=dev --no-audit --no-fund"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Front-end calls /api/* — route those to the serverless functions
[[redirects]]
  from = "/api/checkout/session"
  to = "/.netlify/functions/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/checkout/verify"
  to = "/.netlify/functions/verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/services/status"
  to = "/.netlify/functions/services"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders/list"
  to = "/.netlify/functions/orders"
  status = 200
  force = true
